# Demo only. Copy and sample data for the /design routes (Phase 2 design system).
# Every page that reads this file shows the "Demo data" banner. Nothing here is a real measurement.

banner:
  demo: Demo data
  demo_detail: Every number on these pages is sample data.

nav:
  label: Design system
  home: Darb Juryoku
  links:
    - { href: /design, label: Directions }
    - { href: /design/components, label: Components }
    - { href: /design/overlay, label: Golden outline }
    - { href: /design/mobile, label: Phone }

home:
  intro: An on-device posture coach. Your camera image never leaves this device.
  cta: Open the design system

theme_switch:
  label: Theme
  options: { dark: Night, light: Ivory }

directions:
  title: One brand, three directions
  intro: The live mirror and the daily report, drawn three ways on the approved palette and type. Drag the match control to watch each one react.
  match_label: Match
  pick_label: Chosen
  notes:
    instrument: Gold appears only where you sit well. Drift warms to amber. Dark and quiet next to a code editor.
    ledger: Ivory paper with gold seams. Drift fades to soft grey, so good time reads like a repair line.
    monitor: A calibrated camera monitor. Framing marks and a faint grid make the mirror read as a measuring tool.
  decision:
    title: Night Instrument leads, with Ivory as its light theme
    body: Night Instrument sits beside a dark code editor without glare and keeps gold for one meaning. Ivory Ledger becomes the light theme for the phone in daylight, with drift kept amber so the meaning never changes between themes. The monitor's framing marks echo the camera frame in the mark, so the live mirror keeps them.

mirror:
  states: { upright: Upright, drifting: Drifting, forward_head: Head forward }
  session_label: Good posture this session
  session_value: 38 min of 52
  open_sentinel: Open sentinel
  pause: Pause
  image_label: Your camera image, darkened, with the gold outline of your calibrated posture

today:
  title: Today
  date: Monday, 26 October
  hero_value: '80'
  hero_unit: '%'
  hero_label: of sitting time in good posture
  ribbon:
    start: '09:00'
    bucket_minutes: 10
    # G good, D drift, A away. One letter per 10 minutes.
    states: AGGGGGGGGDDGGGGGGGGGGGGDDGGGGGAAAAGGGGGDDDDDGGGGGGGDGG
    labels: { G: Good posture, D: Drift, A: Away }
    title: The day in 10-minute steps
  facts:
    - { label: Longest drift, value: 50 min }
    - { label: Worst hour, value: '15:00 to 16:00' }
    - { label: Against your 7-day average, value: +11 points }
  observation: Most of your drift came after three, in one long stretch.
  tabs: { today: Today, history: History, live: Live, settings: Settings }

gallery:
