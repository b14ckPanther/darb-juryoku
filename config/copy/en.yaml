sentinel:
  title: Sentinel
  intro: A small window that stays on top while you code. It shows the outline, one word and a pause button. Nudges show here first.
  open: Open sentinel
  close: Close sentinel
  is_open: The sentinel is open in its own window. Keep coding.
  preview_label: Sentinel preview
  unsupported_title: This browser cannot keep a window on top
  unsupported_body: Chrome and Edge can. Here, keep this tab visible. Minutes while it is hidden count as not watched.
  facts_title: How it behaves
  facts:
    - Pauses drawing when nothing changes, to save battery.
    - Never takes focus from your editor.
    - Closes when you end the session.

nudge:
  title: Nudges
  intro: Rare and soft. Nothing turns red, nothing blocks your work, and only one nudge shows at a time.
  ladder_title: How a nudge escalates
  glow_title: Glow
  glow_body: As soon as you drift, the gold fades and the drifting part of the outline warms to amber.
  glow_when: Right away
  notify_title: Notification
  notify_body: After {minutes} minutes of drift, one notification with two choices.
  notify_when: After {minutes} min
  chime_title: Chime
  chime_body: A soft chime with the notification, only if you switch it on.
  chime_when: Off by default
  example_title: The notification
  titles:
