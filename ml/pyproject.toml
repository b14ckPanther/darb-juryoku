[project]
name = "pg-ml"
version = "0.1.0"
description = "Training pipeline for the Darb Juryoku posture model."
requires-python = ">=3.12,<3.13"
dependencies = [
  "pydantic>=2.9",
  "jsonschema>=4.23",
  "pyyaml>=6.0",
  "torch>=2.8",
  "numpy>=2.1",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "ruff>=0.8",
  "mypy>=1.13",
  "types-pyyaml",
  "types-jsonschema",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pg_ml"]

# CPU-only torch wheels on Linux (CI); macOS wheels from PyPI include MPS.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF"]

[tool.mypy]
strict = true
python_version = "3.12"
plugins = ["pydantic.mypy"]
