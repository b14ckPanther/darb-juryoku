# Every user-facing string in the app (agent manual 1.2). `{name}` marks a slot the code fills.
# Validated against packages/schemas/config/copy/en.schema.json; `pnpm --filter web copy:types`
# regenerates the TypeScript shape (apps/web/src/copy/copy.gen.ts), and a test fails if it drifts.
