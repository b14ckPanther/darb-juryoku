name: ci

on:
  push:
    branches: [main, 'phase/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web lint
      - run: pnpm --filter web typecheck
      - run: pnpm --filter web test
      - run: pnpm --filter web build
      - run: pnpm --filter web exec playwright install --with-deps chromium-headless-shell
      - run: pnpm --filter web e2e
        env:
          CI: 'true'

  schemas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm schemas:check

  ml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --project ml --locked
      - run: uv run --project ml pytest ml/tests
      - run: uv run --project ml ruff check ml
      - run: uv run --project ml ruff format --check ml
      - run: uv run --project ml mypy --config-file ml/pyproject.toml ml/src
      - run: uv run --project ml dvc status

  emoji-and-hooks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y bats
      - run: bash scripts/check-emoji.sh
      - run: bats tests/hooks tests/scripts
