permission:
  prompt:
    title: Juryoku needs your camera
    body: It watches your neck and shoulders to tell good posture from drift. Your camera image never leaves this device and is never saved.
    action: Allow camera
  denied:
    title: Camera access is blocked
    body: Your browser blocked the camera for this site. Open the site settings in the address bar, allow the camera, then try again.
    action: Try again
  missing:
    title: No camera found
    body: Connect a camera, or close other apps that are using it, then try again.
    action: Try again

