welcome:
  title: A quiet coach for how you sit while you code
  lede: Juryoku watches your neck and shoulders through the camera, compares them with the posture you chose, and tells you gently when you drift.
  privacy_title: Your camera image never leaves this device
  privacy_body: Each picture is read in memory and dropped. Only minute totals are kept, on this device.
  diagram_label: What happens to your camera image
  diagram:
    camera: Camera
    camera_note: Read in memory
    points: Pose points
    points_note: Neck and shoulders
    state: Posture
    state_note: Upright, drifting or away
    stored: Minute totals
    stored_note: Kept on this device
  never_title: Never saved, never sent
  never_body: Pictures, video and pose points.
  allow: Allow camera
  demo: Try the demo first
  permission:
    prompt:
      title: Juryoku needs your camera
      body: It watches your neck and shoulders to tell good posture from drift. Your camera image never leaves this device and is never saved.
      action: Allow camera
    denied:
      title: Camera access is blocked
      body: Your browser blocked the camera for this site. Open the site settings in the address bar, allow the camera, then try again.
      action: Try again
    missing:
      title: No camera found
      body: Connect a camera, or close other apps that are using it, then try again.
      action: Try again

