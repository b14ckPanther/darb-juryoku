# Pose detection (MediaPipe Tasks Vision PoseLandmarker in a worker). Files are self-hosted under
# the app origin (agent manual 1.3): `pnpm --filter web vendor` copies the WASM from node_modules
# and downloads the model once, checking its SHA-256. Validated against
# packages/schemas/config/pose.schema.json.
wasm_base: /vendor/mediapipe/wasm
model_path: /vendor/mediapipe/pose_landmarker_lite.task
model_source: https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task
model_sha256: 59929e1d1ee95287735ddd833b19cf4ac46d29bc7afddbbf6753c459690d574a
delegates: [GPU, CPU] # tried in order
num_poses: 1
min_pose_detection_confidence: 0.5
min_pose_presence_confidence: 0.5
min_tracking_confidence: 0.5
