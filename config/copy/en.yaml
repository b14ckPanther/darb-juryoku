    forward_head: Bring your head back over your shoulders?
    lean_side: Settle back to the middle?
  primary: Sitting up
  secondary: Snooze {minutes} min
  rules_title: Limits
  cooldown: After a nudge, Juryoku waits {minutes} minutes before the next one.
  quiet: No nudges during quiet hours, {from} to {to}.
  one_at_a_time: One nudge at a time, never in front of your work.
