# Pose detection (MediaPipe Tasks Vision PoseLandmarker in a worker). Files are self-hosted under
# the app origin (agent manual 1.3): `pnpm --filter web vendor` copies the WASM from node_modules
# and downloads the model once, checking its SHA-256. Validated against
# packages/schemas/config/pose.schema.json.
wasm_base: /vendor/mediapipe/wasm
model_path: /vendor/mediapipe/pose_landmarker_lite.task
model_source: https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task
model_sha256: 59929e1d1ee95287735ddd833b19cf4ac46d29bc7afddbbf6753c459690d574a
delegates: [GPU, CPU] # tried in order
num_poses: 1
min_pose_detection_confidence: 0.5
min_pose_presence_confidence: 0.5
min_tracking_confidence: 0.5
# How the golden outline's contour is drawn from landmarks, in units of the distance between the
# ears (head) or along the ear-to-shoulder line (neck). Fitted to the synthetic figure of Phase 2.
outline:
  neck_at: 0.56 # how far down from ear to shoulder the neck sides sit
  neck_inset: 0.69 # neck sides inward from the ear-to-shoulder line
  temple_up: 0.88 # temples above the ears
  temple_inset: 0.07 # temples inward from the ears
  crown_up: 1.25 # top of the head above the ear midpoint
  arm_spread: 0.65 # upper arms outward from the shoulders, in half shoulder widths, to the frame edge
# The live camera image behind the outline, darkened so it reads as a backdrop (UI_DESIGN section 1).
backdrop: { brightness: 0.5, saturate: 0.55 }
